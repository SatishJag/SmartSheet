<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ea580c" />
    <title>Construction Work Management</title>
    <!-- Plus Jakarta Sans from Google Fonts; display=swap + a system-font stack (see --font in src/theme.css) keep the app readable offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <script>
      // Apply the saved colour theme before first paint (no flash). Mirrors src/ui/theme.ts.
      ;(function () {
        var bar = { orange: '#ea580c', blue: '#2563eb', purple: '#7c3aed', green: '#16a34a', red: '#dc2626', teal: '#0d9488', grey: '#475569', black: '#171717' }
        var t = 'orange'
        try {
          var saved = localStorage.getItem('smartsheet-theme')
          if (saved && bar[saved]) t = saved
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', bar[t])
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
